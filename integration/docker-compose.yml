services:
  vault:
    image: hashicorp/vault:2.1
    container_name: penhan-vault
    ports:
      - "18200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: penhan-test-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 2s
      timeout: 5s
      retries: 30
