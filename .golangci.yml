version: "2"

run:
  timeout: 5m
  # Also lint files behind the `integration` build tag, otherwise
  # integration/*_test.go is never checked.
  build-tags:
    - integration

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - unconvert
    - unparam
    - gocritic

  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - style
