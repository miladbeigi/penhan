version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: penhan
    binary: penhan
    main: ./cmd/penhan
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/miladbeigi/penhan/internal/version.Version={{.Version}}
      - -X github.com/miladbeigi/penhan/internal/version.Commit={{.ShortCommit}}
      - -X github.com/miladbeigi/penhan/internal/version.Date={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  github:
    owner: miladbeigi
    name: penhan
  prerelease: auto
  name_template: "v{{ .Version }}"
